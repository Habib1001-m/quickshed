name: Feature request
description: Suggest a tool, workflow, or product improvement.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior.
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Locale impact
      options:
        - English and Arabic
        - English only
        - Arabic only
        - No text changes
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does this require network requests, APIs, telemetry, or file processing?
